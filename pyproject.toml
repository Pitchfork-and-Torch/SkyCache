[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skycache"
version = "1.34.2"
description = "SkyCache Nexus + Skybrary Live: honesty/AEO consistency (llms.txt, version lockstep, RX doctor fail-closed), 78 curated PD works, dual-access packs - not free commercial satellite broadband."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "SkyCache Contributors" }]
keywords = [
  "sdr",
  "satellite",
  "offline",
  "education",
  "humanitarian",
  "rtl-sdr",
  "weather",
  "mesh",
  "community-network",
  "dtn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Education",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "python-multipart>=0.0.9",
  "aiofiles>=23.2",
  "qrcode>=7.4",
]

[project.optional-dependencies]
rx = [
  "sgp4>=2.23",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.3,<0.16",
]

[project.scripts]
skycache = "skycache.__main__:main"

[project.urls]
Homepage = "https://github.com/Pitchfork-and-Torch/SkyCache"
Documentation = "https://github.com/Pitchfork-and-Torch/SkyCache/tree/main/docs"
Issues = "https://github.com/Pitchfork-and-Torch/SkyCache/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["skycache*"]

[tool.setuptools.package-data]
skycache = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin classic defaults so ruff 0.16+ expanded rule sets do not fail CI.
select = ["E4", "E7", "E9", "F"]
